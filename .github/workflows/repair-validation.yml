name: Repair validation

on:
  push:
    branches: [fix/reponpc-repair-2026-09-16]
    paths:
      - '.github/workflows/repair-validation.yml'
      - 'src/**'
      - 'apps/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: repair-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-and-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Prepare offline Python tooling
        run: |
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/wheels" 'tree-sitter>=0.26,<0.27' 'tree-sitter-python>=0.25,<0.26' 'tree-sitter-go>=0.25,<0.26' 'tree-sitter-javascript>=0.25,<0.26' 'tree-sitter-rust>=0.24,<0.25' 'tree-sitter-typescript>=0.23,<0.24' 'ruff>=0.12,<1' 'mypy>=1.15,<2' types-pyyaml
      - name: Prepare locked frontend dependencies
        run: |
          npm install --global pnpm@11.16.0
          pnpm install --frozen-lockfile
          tar -czf "$RUNNER_TEMP/web-dependencies.tar.gz" node_modules apps/web/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repair-test-tools
          path: |
            ${{ runner.temp }}/wheels
            ${{ runner.temp }}/web-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Install locked Python dependencies
        run: |
          python -m pip install 'uv>=0.7,<1'
          uv sync --frozen
      - name: Python baseline
        run: uv run pytest -q --ignore=tests/smoke/test_container.py
      - name: Frontend baseline
        if: always()
        run: pnpm run web:check
