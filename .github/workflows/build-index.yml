name: Build RepoNPC index

on:
  workflow_dispatch:
  push:
    paths:
      - reponpc.yml
      - assets/character/**

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install Python
        run: uv python install 3.14.7
      - name: Install locked dependencies
        run: uv sync --locked --extra indexer
      - name: Validate configuration
        run: uv run reponpc config validate reponpc.yml
      - name: Build immutable index bundle
        run: uv run reponpc index build --config reponpc.yml --output dist
      - name: Publish immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run reponpc index publish --bundle-dir dist
      - name: Advance stable manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run reponpc index publish-manifest --bundle-dir dist
