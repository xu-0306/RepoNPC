name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
      - name: Install Python
        run: uv python install 3.14.7
      - name: Install locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Check Python formatting
        run: uv run ruff format --check src tests
      - name: Lint Python
        run: uv run ruff check src tests
      - name: Type-check Python
        run: uv run mypy src/reponpc
      - name: Test Python
        run: uv run pytest -q
      - name: Build Python package
        run: uv build
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: pnpm run web:check
      - name: Validate Compose configuration
        run: docker compose -f compose.yml config --quiet
      - name: Build application image
        run: docker build --tag reponpc:ci .
