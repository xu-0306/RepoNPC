services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REPONPC_ENV: ${REPONPC_ENV:-production}
      REPONPC_DEPLOYMENT_PROFILE: ${REPONPC_DEPLOYMENT_PROFILE:-production}
      REPONPC_PUBLIC_BASE_URL: ${REPONPC_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      REPONPC_HOST: 0.0.0.0
      REPONPC_PORT: "8000"
      REPONPC_DATA_DIR: /var/lib/reponpc
      REPONPC_LOG_LEVEL: ${REPONPC_LOG_LEVEL:-INFO}
      REPONPC_TRUSTED_HOSTS: ${REPONPC_TRUSTED_HOSTS:-127.0.0.1,localhost}
      REPONPC_ALLOWED_ORIGINS: ${REPONPC_ALLOWED_ORIGINS:-}
      REPONPC_TRUSTED_PROXY_CIDRS: ${REPONPC_TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      REPONPC_CONFIG_REPOSITORY: ${REPONPC_CONFIG_REPOSITORY:-example/reponpc}
      REPONPC_CONFIG_BRANCH: ${REPONPC_CONFIG_BRANCH:-main}
      REPONPC_CONFIG_PATH: ${REPONPC_CONFIG_PATH:-reponpc.yml}
      REPONPC_INDEX_MANIFEST_URL: ${REPONPC_INDEX_MANIFEST_URL:-https://raw.githubusercontent.com/example/reponpc/main/stable-manifest.json}
      REPONPC_INDEX_POLL_SECONDS: ${REPONPC_INDEX_POLL_SECONDS:-300}
      REPONPC_MAX_BUNDLE_BYTES: ${REPONPC_MAX_BUNDLE_BYTES:-536870912}
      REPONPC_KEEP_VALID_BUNDLES: ${REPONPC_KEEP_VALID_BUNDLES:-2}
      REPONPC_GITHUB_TOKEN: ${REPONPC_GITHUB_TOKEN:-}
      REPONPC_GITHUB_TOKEN_FILE: ${REPONPC_GITHUB_TOKEN_FILE:-}
      REPONPC_GITHUB_API_URL: ${REPONPC_GITHUB_API_URL:-https://api.github.com}
      REPONPC_INDEX_WORKFLOW: ${REPONPC_INDEX_WORKFLOW:-build-index.yml}
      REPONPC_GITHUB_OAUTH_CLIENT_ID: ${REPONPC_GITHUB_OAUTH_CLIENT_ID:-}
      REPONPC_GITHUB_OAUTH_CLIENT_SECRET: ${REPONPC_GITHUB_OAUTH_CLIENT_SECRET:-}
      REPONPC_GITHUB_OAUTH_CLIENT_SECRET_FILE: ${REPONPC_GITHUB_OAUTH_CLIENT_SECRET_FILE:-}
      REPONPC_GITHUB_OAUTH_CALLBACK_URL: ${REPONPC_GITHUB_OAUTH_CALLBACK_URL:-}
      REPONPC_CREDENTIAL_ENCRYPTION_KEY: ${REPONPC_CREDENTIAL_ENCRYPTION_KEY:-}
      REPONPC_CREDENTIAL_ENCRYPTION_KEY_FILE: ${REPONPC_CREDENTIAL_ENCRYPTION_KEY_FILE:-}
      REPONPC_CHAT_PROVIDER: ${REPONPC_CHAT_PROVIDER:-ollama}
      REPONPC_CHAT_MODEL: ${REPONPC_CHAT_MODEL:-setup-required}
      REPONPC_CHAT_BASE_URL: ${REPONPC_CHAT_BASE_URL:-http://ollama:11434}
      REPONPC_CHAT_API_KEY: ${REPONPC_CHAT_API_KEY:-}
      REPONPC_CHAT_API_KEY_FILE: ${REPONPC_CHAT_API_KEY_FILE:-}
      REPONPC_CHAT_MAX_CONTEXT_TOKENS: ${REPONPC_CHAT_MAX_CONTEXT_TOKENS:-32768}
      REPONPC_CHAT_MAX_OUTPUT_TOKENS: ${REPONPC_CHAT_MAX_OUTPUT_TOKENS:-1000}
      REPONPC_CHAT_TIMEOUT_SECONDS: ${REPONPC_CHAT_TIMEOUT_SECONDS:-45}
      # The application has no in-process embedding default. These values are
      # a recommended external Ollama starter profile; readiness still requires
      # a live probe and a matching bundle.
      REPONPC_EMBEDDING_PROVIDER: ${REPONPC_EMBEDDING_PROVIDER:-ollama}
      REPONPC_EMBEDDING_MODEL: ${REPONPC_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      REPONPC_EMBEDDING_DIMENSION: ${REPONPC_EMBEDDING_DIMENSION:-1024}
      REPONPC_EMBEDDING_NORMALIZED: ${REPONPC_EMBEDDING_NORMALIZED:-true}
      REPONPC_EMBEDDING_BASE_URL: ${REPONPC_EMBEDDING_BASE_URL:-http://ollama:11434}
      REPONPC_EMBEDDING_API_KEY: ${REPONPC_EMBEDDING_API_KEY:-}
      REPONPC_EMBEDDING_API_KEY_FILE: ${REPONPC_EMBEDDING_API_KEY_FILE:-}
      REPONPC_ADMIN_USERNAME: ${REPONPC_ADMIN_USERNAME:-}
      REPONPC_ADMIN_PASSWORD_HASH: ${REPONPC_ADMIN_PASSWORD_HASH:-}
      REPONPC_ADMIN_IDLE_MINUTES: ${REPONPC_ADMIN_IDLE_MINUTES:-30}
      REPONPC_ADMIN_ABSOLUTE_HOURS: ${REPONPC_ADMIN_ABSOLUTE_HOURS:-12}
      REPONPC_IP_HASH_KEY: ${REPONPC_IP_HASH_KEY:-}
      REPONPC_IP_HASH_KEY_FILE: ${REPONPC_IP_HASH_KEY_FILE:-}
      REPONPC_RATE_LIMIT_REQUESTS_PER_MINUTE: ${REPONPC_RATE_LIMIT_REQUESTS_PER_MINUTE:-10}
      REPONPC_GLOBAL_CHAT_CONCURRENCY: ${REPONPC_GLOBAL_CHAT_CONCURRENCY:-2}
      REPONPC_DAILY_CHAT_REQUEST_BUDGET: ${REPONPC_DAILY_CHAT_REQUEST_BUDGET:-200}
      REPONPC_MAX_MESSAGE_CHARACTERS: ${REPONPC_MAX_MESSAGE_CHARACTERS:-2000}
      REPONPC_MAX_HISTORY_MESSAGES: ${REPONPC_MAX_HISTORY_MESSAGES:-6}
      REPONPC_MAX_HISTORY_CHARACTERS: ${REPONPC_MAX_HISTORY_CHARACTERS:-6000}
      REPONPC_INPUT_COST_PER_MILLION_TOKENS: ${REPONPC_INPUT_COST_PER_MILLION_TOKENS:-}
      REPONPC_OUTPUT_COST_PER_MILLION_TOKENS: ${REPONPC_OUTPUT_COST_PER_MILLION_TOKENS:-}
      REPONPC_SQLITE_BUSY_TIMEOUT_MS: ${REPONPC_SQLITE_BUSY_TIMEOUT_MS:-5000}
      REPONPC_PROVIDER_HEALTH_SECONDS: ${REPONPC_PROVIDER_HEALTH_SECONDS:-60}
      REPONPC_SSE_KEEPALIVE_SECONDS: ${REPONPC_SSE_KEEPALIVE_SECONDS:-15}
      REPONPC_SHUTDOWN_GRACE_SECONDS: ${REPONPC_SHUTDOWN_GRACE_SECONDS:-30}
      REPONPC_PERSIST_CONVERSATIONS: ${REPONPC_PERSIST_CONVERSATIONS:-false}
    ports:
      - "127.0.0.1:${REPONPC_HOST_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
    volumes:
      - reponpc-data:/var/lib/reponpc
      - ./secrets:/run/secrets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  reponpc-data:
